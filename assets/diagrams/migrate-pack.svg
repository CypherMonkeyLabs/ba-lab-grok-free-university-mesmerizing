<rect class="ba-box" x="314" y="164" width="250" height="64" rx="16" fill="#bbf7d0"/>
<text x="330" y="190.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Metric definitions for</text>
<text x="330" y="212.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">go-live day</text>
<text x="36" y="284" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">Costs stay blank until sourced.</text>
<text x="36" y="308" fill="#99f6e4" font-family="Segoe UI, sans-serif" font-size="13">Independent study drawing. Not affiliated.</text>
