</style>
<rect width="100%" height="100%" rx="24" fill="#0b1220"/>
<text x="36" y="46" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Analysis pack for the move</text>
<rect class="ba-box" x="36" y="78" width="250" height="64" rx="16" fill="#99f6e4"/>
<text x="52" y="104.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Outcomes and success</text>
<text x="52" y="126.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">criteria</text>
<rect class="ba-box" x="314" y="78" width="250" height="64" rx="16" fill="#c7d2fe"/>
<text x="330" y="104.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Journey with placeholder</text>
<text x="330" y="126.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">owners</text>
<rect class="ba-box" x="592" y="78" width="250" height="64" rx="16" fill="#fbcfe8"/>
<text x="608" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">RASCI and swimlanes</text>
