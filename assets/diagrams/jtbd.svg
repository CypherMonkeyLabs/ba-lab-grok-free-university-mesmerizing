<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" role="img">
<title>Job story</title>
<rect width="100%" height="100%" rx="24" fill="#0b1220"/>
<text x="36" y="46" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Job story</text>
<rect x="36" y="78" width="250" height="64" rx="16" fill="#99f6e4"/>
<text x="52" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">When this situation</text>
<rect x="314" y="78" width="250" height="64" rx="16" fill="#c7d2fe"/>
<text x="330" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">I want this progress</text>
<rect x="36" y="164" width="250" height="64" rx="16" fill="#fbcfe8"/>
<text x="52" y="190.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">So I can reach this</text>
<text x="52" y="212.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">outcome</text>
<rect x="314" y="164" width="250" height="64" rx="16" fill="#fde68a"/>
<text x="330" y="190.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Forces that resist the</text>
<text x="330" y="212.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">switch</text>
<text x="36" y="278" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">Circumstance first. Feature second.</text>
</svg>