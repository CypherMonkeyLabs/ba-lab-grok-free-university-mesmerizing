<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" role="img">
<title>RACI roles</title>
<rect width="100%" height="100%" rx="24" fill="#0b1220"/>
<text x="36" y="46" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">RACI roles</text>
<rect x="36" y="78" width="250" height="64" rx="16" fill="#99f6e4"/>
<text x="52" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Responsible: does the work</text>
<rect x="314" y="78" width="250" height="64" rx="16" fill="#c7d2fe"/>
<text x="330" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Accountable: one owner</text>
<rect x="36" y="164" width="250" height="64" rx="16" fill="#fbcfe8"/>
<text x="52" y="201.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Consulted: asked before</text>
<rect x="314" y="164" width="250" height="64" rx="16" fill="#fde68a"/>
<text x="330" y="201.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Informed: told after</text>
<text x="36" y="278" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">Two accountables means the decision is unclear.</text>
</svg>