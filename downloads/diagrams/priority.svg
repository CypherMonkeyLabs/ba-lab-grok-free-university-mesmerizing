<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" role="img">
<title>Priority words</title>
<style>
@keyframes baPulse { 50% { opacity: 0.78 } }
.ba-box { animation: baPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { .ba-box { animation: none } }
</style>
<rect width="100%" height="100%" rx="24" fill="#0b1220"/>
<text x="36" y="46" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Priority words</text>
<rect class="ba-box" x="36" y="78" width="250" height="64" rx="16" fill="#99f6e4"/>
<text x="52" y="115.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Must: legal or safety</text>
<rect class="ba-box" x="314" y="78" width="250" height="64" rx="16" fill="#c7d2fe"/>
<text x="330" y="104.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Should: the outcome</text>
<text x="330" y="126.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">depends on it</text>
<rect class="ba-box" x="36" y="164" width="250" height="64" rx="16" fill="#fbcfe8"/>
<text x="52" y="190.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Could: useful, not this</text>
<text x="52" y="212.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">release</text>
<rect class="ba-box" x="314" y="164" width="250" height="64" rx="16" fill="#fde68a"/>
<text x="330" y="201.0" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16">Won't: out of this scope</text>
<text x="36" y="278" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">A study split. The DSDM page did not open, so it is not linked.</text>
</svg>